description: CYGIA (Zhuhai CYGIA Automation Equipment Co.) is an intelligent-factory equipment and
  solution provider founded in 2006 and headquartered in Zhuhai, China. It develops, manufactures, and
  services intelligent automation and automated-test equipment for consumer electronics, semiconductor and
  integrated-circuit, automotive, medical, and new-energy industries. Once backed by Qiming Venture Partners,
  CYGIA became a subsidiary of publicly traded CYG (Changyuan Group, Shanghai Stock Exchange 600525.SH) in
  2015. This profile was added to the API Evangelist network as a VC-portfolio lead; enrichment found no public
  API, developer portal, documentation, or SDK surface for CYGIA, which is a hardware/automation-equipment
  manufacturer rather than an API provider.
